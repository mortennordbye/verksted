# The Dockerfile pins versions and the lockfile pins the rest, so nothing moves
# without a PR. Weekly rather than daily: this is one person's homelab, and a
# daily drip is noise that gets ignored.
#
# Every ecosystem waits seven days before offering a release. Most of what a
# compromised npm package does, it does in the first days after publication,
# and what lands here lands on a pod holding every credential this homelab has.
# Nothing is given up by waiting a week for a routine bump — and nothing
# security-related is delayed by it either, for the reason in the next
# paragraph: advisories do not come through this file.
#
# Nothing here schedules security updates. Those are a repository setting
# ("Dependabot security updates"), they ignore this file's interval, and they
# arrive as soon as an advisory matches the lockfile. This file only shapes the
# routine version updates.
#
# Grouping is tuned for dependabot-auto-merge.yml: anything below a major lands
# on its own once CI is green, so the goal is few PRs rather than granular ones.
# Majors are excluded from the groups so each arrives alone and readable, which
# is what a human is going to review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine bumps; anything major still arrives on its own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node describes the runtime, so its major is not an independent
      # choice: it moves when the image moves, and taking 26 while the pod runs
      # 24 would type-check against APIs that are not there. Same LTS decision
      # as the node image below, tracked in the same BACKLOG entry.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The agent CLIs the image installs globally. A manifest with no lockfile, so
  # what dependabot bumps is the pin itself. These are the three programs the
  # whole product runs on, and until now which version shipped was decided by
  # whichever build first cached that layer.
  - package-ecosystem: npm
    directory: /runtime/cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      agent-clis:
        update-types: [minor, patch]

  # The text-to-speech worker's python environment.
  - package-ecosystem: pip
    directory: /runtime
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      kokoro-minor-and-patch:
        update-types: [minor, patch]

  # The dind sidecar the dev stack runs against. Same image family as the pod's,
  # and it was the one pinned version in this repo nothing watched.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Which Node major to run is an LTS decision, and Dependabot has no idea
      # which releases are LTS. Left to itself it offered node:25-slim in #26,
      # three months after 25 went end of life, and node:26-trixie-slim in #46,
      # while 26 was still Current. Both would have taken the pod off a
      # supported runtime.
      #
      # Nothing is lost by ignoring the major: the tag is `24-trixie-slim`, so
      # every 24.x security release lands on the next image build without a PR.
      # The next move is 26, once it becomes LTS on 2026-10-28 (BACKLOG.md).
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Action majors are usually a runner-version bump and little else, but
      # they are still majors, so they stay out of the group and out of
      # auto-merge.
      actions-minor-and-patch:
        update-types: [minor, patch]
