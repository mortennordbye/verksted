name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight; main still runs to completion so a
# promoted image is never built from a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      # The backend file-search/replace routes shell out to ripgrep; the tests
      # exercise the real binary. The runtime image installs it, so the CI runner
      # needs it too (ubuntu-latest does not ship rg). shellcheck is on the
      # runner already, but `npm run lint` now needs it, so it is named here
      # rather than assumed.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Privilege separation's tests switch uids, which needs root; `npm test`
      # above skips them on the runner's own user.
      - run: sudo --preserve-env=PATH npx vitest run test/agent-user.test.ts
        working-directory: backend
      - run: npm run build

  # The browser half of the suite. It was `make e2e` only, which means it ran
  # when someone remembered — and the app is edited by unattended agents, whose
  # only signal is what CI says. A bundle that fails to load or a route that
  # renders nothing is invisible to every other job here.
  #
  # Separate from `test` rather than folded into it: this one builds the
  # frontend and launches a real chromium, and keeping `npm test` free of both
  # is what lets an agent run it in a few seconds.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      # The same version the image installs and backend/package.json pins;
      # image-pins.test.ts keeps those two equal, and this reads from the pinned
      # one so a bump cannot leave CI driving a different chromium than the pod.
      - name: install the chromium playwright-core drives
        run: |
          v=$(node -p "require('./backend/package.json').dependencies['playwright-core']")
          npx --yes "playwright@$v" install --with-deps chromium
      - run: npm run build --workspace frontend
      - run: npx vitest run --config e2e/vitest.config.ts

  # The commit hook in the image (runtime/git-hooks/commit-msg) is the
  # prevention; this is the backstop for commits made anywhere else — a laptop
  # clone, the GitHub web editor, an agent running outside the pod. Catching it
  # on the PR is the difference between deleting a line and rewriting history.
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: reject AI attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anchored to the start of a line so it matches a trailer and not the
          # word in a commit body — this repo drives the claude CLI and talks
          # about it constantly. Every agent the pod runs, as the image's
          # commit-msg hook strips them.
          hits=$(git log --format='%H%n%B' "$BASE..$HEAD" \
            | grep -inE '^(claude-session:|co-authored-by:.*(claude|anthropic|codex|openai|chatgpt|gemini|antigravity|jules)|[^a-z]*generated (with|by) \[?(claude|codex|openai|chatgpt|gemini|antigravity))' || true)
          if [ -n "$hits" ]; then
            echo "::error::AI attribution found in commit messages"
            echo "$hits"
            echo
            echo "Strip it with: git rebase -i $BASE   (or amend, if it is the tip)"
            exit 1
          fi
          echo "clean: $(git rev-list --count "$BASE..$HEAD") commit(s), no AI attribution"

  # Whether a push to main changed anything the image is built from. Every
  # build is promoted, and the Deployment is Recreate: a new image restarts the
  # pod, and every tmux session on it goes with the old container. A push that
  # only touched the docs has no business doing that (O-19).
  changes:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        # Anything that is not prose builds. A diff that cannot be taken (a
        # force push, a first push) builds too: when in doubt, ship.
        run: |
          set +e
          git diff --quiet "$BEFORE" HEAD -- . ':(exclude)*.md' ':(exclude)design/**'
          rc=$?
          set -e
          if [ "$rc" = 0 ]; then echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

  image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.build == 'true'
    needs: [test, e2e, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # The scan below files what it finds under Security → Code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The SemVer tag the homelab Kargo Warehouse promotes, greatest first. It
      # was the workflow's run number, which starts again at 1 if the workflow
      # is renamed or recreated, and Kargo would then never pick a new build
      # over 0.0.397 (O-20). The commit's own time only grows on main, and is
      # already far past every run number there has been.
      - id: version
        run: echo "tag=0.0.$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ steps.version.outputs.tag }}
      # Build once, prove it boots, then push. Tagging an image `latest` that
      # cannot start is the one CI failure that reaches the cluster.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          load: true
          tags: verksted:smoke
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
      - name: smoke-test the image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e REPOS_DIR=/data/repos -e SESSIONS_DIR=/data/sessions \
            -e SCHEDULES_DIR=/data/schedules -e SETTINGS_FILE=/data/settings.json \
            verksted:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          test -n "$ok"

      # The image carries chromium, a python venv, half a dozen CLIs and 893 npm
      # packages, and it holds every credential this homelab has. Nothing looked
      # at any of it before now.
      #
      # Two passes on purpose. The first files everything under Security → Code
      # scanning, where a HIGH with no fix yet is a thing to know rather than a
      # thing to act on. The second is the gate, and it is deliberately narrow:
      # CRITICAL only, and only when the upstream has already shipped a fix, so
      # it fires when there is something to do about it. A base-image CVE nobody
      # has patched must not be what stops a deploy.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: verksted:smoke
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          scanners: vuln
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: verksted:smoke
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          # The database came down with the pass above; this is the same scan
          # read a second way.
          skip-setup-trivy: true
          skip-db-update: true

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # In the registry, beside the image, rather than the Actions cache:
          # that one is capped at 10 GB per repository, and this image's layers
          # had it at 8 with LRU eviction about to start throwing away the
          # expensive ones (O-16). Not a SemVer tag, so Kargo never sees it.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
