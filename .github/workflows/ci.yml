name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight; main still runs to completion so a
# promoted image is never built from a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The backend file-search/replace routes shell out to ripgrep; the tests
      # exercise the real binary. The runtime image installs it, so the CI runner
      # needs it too (ubuntu-latest does not ship rg).
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            # Monotonic SemVer tag the homelab Kargo Warehouse selects to promote.
            type=raw,value=0.0.${{ github.run_number }}
      # Build once, prove it boots, then push. Tagging an image `latest` that
      # cannot start is the one CI failure that reaches the cluster.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: verksted:smoke
          cache-from: type=gha
      - name: smoke-test the image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e REPOS_DIR=/data/repos -e SESSIONS_DIR=/data/sessions \
            -e SCHEDULES_DIR=/data/schedules -e SETTINGS_FILE=/data/settings.json \
            verksted:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          test -n "$ok"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
