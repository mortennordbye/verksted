name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight; main still runs to completion so a
# promoted image is never built from a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The backend file-search/replace routes shell out to ripgrep; the tests
      # exercise the real binary. The runtime image installs it, so the CI runner
      # needs it too (ubuntu-latest does not ship rg).
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The commit hook in the image (runtime/git-hooks/commit-msg) is the
  # prevention; this is the backstop for commits made anywhere else — a laptop
  # clone, the GitHub web editor, an agent running outside the pod. Catching it
  # on the PR is the difference between deleting a line and rewriting history.
  attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: reject AI attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anchored to the start of a line so it matches a trailer and not the
          # word in a commit body — this repo drives the claude CLI and talks
          # about it constantly.
          hits=$(git log --format='%H%n%B' "$BASE..$HEAD" \
            | grep -inE '^(claude-session:|co-authored-by:.*claude|generated with.*claude)' || true)
          if [ -n "$hits" ]; then
            echo "::error::AI attribution found in commit messages"
            echo "$hits"
            echo
            echo "Strip it with: git rebase -i $BASE   (or amend, if it is the tip)"
            exit 1
          fi
          echo "clean: $(git rev-list --count "$BASE..$HEAD") commit(s), no AI attribution"

  image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            # Monotonic SemVer tag the homelab Kargo Warehouse selects to promote.
            type=raw,value=0.0.${{ github.run_number }}
      # Build once, prove it boots, then push. Tagging an image `latest` that
      # cannot start is the one CI failure that reaches the cluster.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: verksted:smoke
          cache-from: type=gha
      - name: smoke-test the image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e REPOS_DIR=/data/repos -e SESSIONS_DIR=/data/sessions \
            -e SCHEDULES_DIR=/data/schedules -e SETTINGS_FILE=/data/settings.json \
            verksted:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          test -n "$ok"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
